<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 猫咪连连看</title>
<style>
  :root {
    --pink:#ff85a1;--pink-l:#ffc2d1;--purple:#c77dff;--purple-l:#e0aaff;
    --yellow:#ffd166;--green:#06d6a0;--blue:#4cc9f0;
    --bg:#fff0f5;--card:#fff8fc;--text:#3d2c35;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

  /* Nav */
  nav{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;
    background:rgba(255,240,245,.9);backdrop-filter:blur(10px);
    border-bottom:2px solid var(--pink-l);box-shadow:0 2px 12px rgba(255,133,161,.12);position:sticky;top:0;z-index:200;}
  .logo{font-size:1.3rem;font-weight:800;color:var(--pink);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--purple);
    font-weight:700;padding:8px 18px;background:var(--purple-l);border-radius:20px;font-size:.9rem;transition:all .2s;}
  .back-btn:hover{background:var(--purple);color:#fff;}

  /* Layout */
  .game-wrap{max-width:900px;margin:0 auto;padding:24px 16px;}
  .game-title{text-align:center;font-size:2.2rem;font-weight:800;margin-bottom:4px;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .game-subtitle{text-align:center;color:#9b6a7a;margin-bottom:24px;font-size:1rem;}

  /* Stats bar */
  .stats{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-box{background:var(--card);border-radius:18px;padding:10px 22px;
    box-shadow:0 4px 16px rgba(199,125,255,.12);border:2px solid var(--purple-l);
    display:flex;align-items:center;gap:8px;font-weight:800;}
  .stat-box .val{font-size:1.4rem;color:var(--purple);}
  .stat-box .lbl{font-size:.8rem;color:#9b6a7a;}
  #timer-box{border-color:var(--pink-l);}
  #timer-box .val{color:var(--pink);}
  #timer-box.danger .val{color:#e63946;animation:pulse .5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

  /* Controls */
  .controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:24px;
    border:none;cursor:pointer;font-weight:800;font-size:.92rem;transition:all .22s;font-family:inherit;}
  .btn:hover{transform:translateY(-2px);}
  .btn-start{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 16px rgba(255,133,161,.35);}
  .btn-hint{background:#fff3cd;color:#b8860b;border:2px solid var(--yellow);}
  .btn-shuffle{background:#d4f7ef;color:#06a07b;border:2px solid var(--green);}
  .btn-home{background:var(--purple-l);color:var(--purple);border:2px solid var(--purple-l);}

  /* Level selector */
  .level-row{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .level-row label{font-weight:700;color:#9b6a7a;}
  .level-btn{padding:7px 18px;border-radius:18px;border:2px solid var(--pink-l);
    background:#fff;color:var(--text);font-weight:700;cursor:pointer;transition:all .2s;font-size:.88rem;}
  .level-btn.active{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}

  /* Board */
  .board-outer{display:flex;justify-content:center;position:relative;}
  #board{display:grid;gap:4px;padding:12px;background:rgba(255,255,255,.7);border-radius:24px;
    box-shadow:0 8px 32px rgba(199,125,255,.15);border:2px solid var(--purple-l);}

  /* Cells */
  .cell{
    width:60px;height:60px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:2rem;transition:all .18s;
    background:rgba(255,240,245,.85);border:2px solid transparent;
    user-select:none;position:relative;
  }
  .cell:hover:not(.empty):not(.removed){transform:scale(1.1);border-color:var(--pink-l);box-shadow:0 4px 12px rgba(255,133,161,.3);}
  .cell.selected{border-color:var(--pink)!important;background:var(--pink-l)!important;transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,133,161,.4);}
  .cell.hint-glow{animation:hintPulse .6s ease-in-out 3;}
  @keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(199,125,255,.5)}50%{box-shadow:0 0 0 8px rgba(199,125,255,.0);transform:scale(1.15);border-color:var(--purple);}}
  .cell.removed{opacity:0;pointer-events:none;transform:scale(.5);}
  .cell.empty{background:transparent;border-color:transparent;cursor:default;}
  .cell.flash-match{animation:matchFlash .4s ease-out;}
  @keyframes matchFlash{0%{background:var(--yellow);transform:scale(1.2)}100%{background:transparent;transform:scale(.5);opacity:0}}
  .cell.wrong-shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* SVG connector line */
  #connector-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
  .conn-line{stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;
    stroke-dasharray:300;stroke-dashoffset:300;animation:drawLine .35s ease-out forwards;}
  @keyframes drawLine{to{stroke-dashoffset:0}}

  /* Overlays */
  .overlay{position:fixed;inset:0;background:rgba(61,44,53,.55);backdrop-filter:blur(6px);
    z-index:300;display:flex;align-items:center;justify-content:center;}
  .overlay-box{background:var(--card);border-radius:32px;padding:48px 52px;text-align:center;
    box-shadow:0 16px 64px rgba(199,125,255,.25);max-width:420px;width:90%;}
  .overlay-box h2{font-size:2rem;font-weight:800;margin-bottom:12px;}
  .overlay-box p{color:#9b6a7a;margin-bottom:8px;font-size:1.05rem;}
  .overlay-box .big-emoji{font-size:5rem;display:block;margin-bottom:16px;animation:float 2s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* Message toast */
  #toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:rgba(255,133,161,.95);color:#fff;padding:12px 28px;border-radius:24px;
    font-weight:800;font-size:1rem;box-shadow:0 8px 24px rgba(255,133,161,.4);
    pointer-events:none;opacity:0;transition:all .3s;z-index:400;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Responsive */
  @media(max-width:600px){
    .cell{width:46px;height:46px;font-size:1.5rem;border-radius:9px;}
    #board{gap:3px;padding:8px;}
    .game-title{font-size:1.6rem;}
  }
  @media(max-width:400px){
    .cell{width:38px;height:38px;font-size:1.2rem;}
    #board{gap:2px;padding:6px;}
  }
</style>
</head>
<body>

<nav>
  <div class="logo">🐱 猫咪连连看</div>
  <a href="index.html" class="back-btn">← 返回主页</a>
</nav>

<div class="game-wrap">
  <h1 class="game-title">🐱 猫咪连连看</h1>
  <p class="game-subtitle">找到相同的猫咪，三步内可以连通就能消除！</p>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-box" id="score-box"><span class="val" id="score">0</span><span class="lbl">分数</span></div>
    <div class="stat-box" id="combo-box"><span class="val" id="combo">x1</span><span class="lbl">连击</span></div>
    <div class="stat-box" id="timer-box"><span class="val" id="timer">120</span><span class="lbl">秒</span></div>
    <div class="stat-box"><span class="val" id="remaining">0</span><span class="lbl">剩余</span></div>
  </div>

  <!-- Level -->
  <div class="level-row">
    <label>难度：</label>
    <button class="level-btn active" data-level="easy">🌸 简单 (6×6)</button>
    <button class="level-btn" data-level="normal">🎮 普通 (8×8)</button>
    <button class="level-btn" data-level="hard">🔥 困难 (10×8)</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-start" id="btn-start">🎮 开始游戏</button>
    <button class="btn btn-hint" id="btn-hint" disabled>💡 提示</button>
    <button class="btn btn-shuffle" id="btn-shuffle" disabled>🔀 洗牌</button>
  </div>

  <!-- Board -->
  <div class="board-outer">
    <div id="board"></div>
    <svg id="connector-svg" style="display:none;"></svg>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Overlays -->
<div class="overlay" id="win-overlay" style="display:none;">
  <div class="overlay-box">
    <span class="big-emoji">🎉</span>
    <h2 style="color:var(--purple)">太厉害啦！</h2>
    <p>你消除了所有猫咪！✨</p>
    <p style="font-size:1.2rem;font-weight:800;color:var(--pink);margin:12px 0">得分：<span id="win-score">0</span></p>
    <button class="btn btn-start" style="margin-top:16px;width:100%;justify-content:center;" onclick="startGame()">🔄 再玩一局</button>
  </div>
</div>

<div class="overlay" id="lose-overlay" style="display:none;">
  <div class="overlay-box">
    <span class="big-emoji">😿</span>
    <h2 style="color:var(--pink)">时间到啦！</h2>
    <p>还剩 <span id="lose-remain">0</span> 对猫咪没消除...</p>
    <p style="font-size:1.2rem;font-weight:800;color:var(--purple);margin:12px 0">得分：<span id="lose-score">0</span></p>
    <button class="btn btn-start" style="margin-top:16px;width:100%;justify-content:center;" onclick="startGame()">🔄 再来一次</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════
const CATS = ['🐱','😺','😸','😹','😻','😼','😽','🙀','😿','🐾','🐈','🐈‍⬛'];
const LEVELS = {
  easy:   { cols:6, rows:6,  time:120, types:6  },
  normal: { cols:8, rows:8,  time:150, types:8  },
  hard:   { cols:10,rows:8,  time:120, types:10 }
};

// ════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════
let grid = [];           // 2-D array; 0 = empty, else emoji string
let ROWS = 6, COLS = 6;
let selected = null;     // {r, c}
let score = 0;
let combo = 0;
let comboTimer = null;
let timeLeft = 120;
let timerInterval = null;
let gameActive = false;
let hintCells = null;
let currentLevel = 'easy';

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════
document.querySelectorAll('.level-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentLevel = b.dataset.level;
  });
});
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-hint').addEventListener('click', doHint);
document.getElementById('btn-shuffle').addEventListener('click', doShuffle);

// ════════════════════════════════════════════════
//  GAME FLOW
// ════════════════════════════════════════════════
function startGame() {
  hideOverlays();
  const cfg = LEVELS[currentLevel];
  ROWS = cfg.rows; COLS = cfg.cols;
  timeLeft = cfg.time;
  score = 0; combo = 0;
  selected = null;
  hintCells = null;
  gameActive = true;

  document.getElementById('btn-hint').disabled = false;
  document.getElementById('btn-shuffle').disabled = false;

  buildGrid(cfg.types);
  renderBoard();
  updateStats();
  clearInterval(timerInterval);
  timerInterval = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  document.getElementById('timer').textContent = timeLeft;
  const tb = document.getElementById('timer-box');
  if (timeLeft <= 20) tb.classList.add('danger'); else tb.classList.remove('danger');
  if (timeLeft <= 0) endGame(false);
}

function endGame(win) {
  clearInterval(timerInterval);
  gameActive = false;
  document.getElementById('btn-hint').disabled = true;
  document.getElementById('btn-shuffle').disabled = true;
  if (win) {
    document.getElementById('win-score').textContent = score;
    document.getElementById('win-overlay').style.display = 'flex';
  } else {
    document.getElementById('lose-remain').textContent = countRemaining();
    document.getElementById('lose-score').textContent = score;
    document.getElementById('lose-overlay').style.display = 'flex';
  }
}

function hideOverlays() {
  document.getElementById('win-overlay').style.display = 'none';
  document.getElementById('lose-overlay').style.display = 'none';
}

// ════════════════════════════════════════════════
//  GRID BUILDER
// ════════════════════════════════════════════════
function buildGrid(typeCount) {
  const total = ROWS * COLS;
  const types = CATS.slice(0, typeCount);
  let pool = [];
  // Fill pairs evenly
  for (let i = 0; i < Math.floor(total / 2); i++) {
    const t = types[i % types.length];
    pool.push(t, t);
  }
  // If odd total, add one neutral to make even (shouldn't happen with 6×6 etc.)
  shuffle(pool);
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid.push(pool.slice(r * COLS, r * COLS + COLS));
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════
function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (grid[r][c] === '' ? ' empty' : '');
      cell.dataset.r = r; cell.dataset.c = c;
      cell.textContent = grid[r][c] || '';
      cell.addEventListener('click', () => onCellClick(r, c));
      board.appendChild(cell);
    }
  }
  updateRemaining();
}

function cellEl(r, c) {
  return document.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function updateStats() {
  document.getElementById('score').textContent = score;
  document.getElementById('combo').textContent = 'x' + Math.max(1, combo);
  document.getElementById('timer').textContent = timeLeft;
  updateRemaining();
}

function updateRemaining() {
  document.getElementById('remaining').textContent = countRemaining();
}

function countRemaining() {
  let n = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] !== '') n++;
  return n;
}

// ════════════════════════════════════════════════
//  CLICK HANDLER
// ════════════════════════════════════════════════
function onCellClick(r, c) {
  if (!gameActive || grid[r][c] === '') return;
  clearHintGlow();
  hintCells = null;

  if (!selected) {
    selected = {r, c};
    cellEl(r, c).classList.add('selected');
    return;
  }

  // Click same cell → deselect
  if (selected.r === r && selected.c === c) {
    cellEl(r, c).classList.remove('selected');
    selected = null;
    return;
  }

  // Different cell — check match
  if (grid[selected.r][selected.c] !== grid[r][c]) {
    // Wrong type — switch selection
    cellEl(selected.r, selected.c).classList.remove('selected');
    cellEl(selected.r, selected.c).classList.add('wrong-shake');
    setTimeout(() => cellEl(selected.r, selected.c)?.classList.remove('wrong-shake'), 400);
    selected = {r, c};
    cellEl(r, c).classList.add('selected');
    return;
  }

  // Same type — check path
  const path = findPath(selected.r, selected.c, r, c);
  if (!path) {
    // Can't connect
    cellEl(selected.r, selected.c).classList.remove('selected');
    cellEl(r, c).classList.add('wrong-shake');
    setTimeout(() => cellEl(r, c)?.classList.remove('wrong-shake'), 400);
    selected = {r, c};
    cellEl(r, c).classList.add('selected');
    showToast('🐾 无法连通！');
    return;
  }

  // ✅ Match!
  doMatch(selected.r, selected.c, r, c, path);
}

// ════════════════════════════════════════════════
//  MATCH
// ════════════════════════════════════════════════
function doMatch(r1, c1, r2, c2, path) {
  const e1 = cellEl(r1, c1);
  const e2 = cellEl(r2, c2);

  // Draw connector
  drawConnector(path);

  // Flash & remove after short delay
  e1.classList.add('flash-match');
  e2.classList.add('flash-match');

  setTimeout(() => {
    grid[r1][c1] = '';
    grid[r2][c2] = '';
    e1.textContent = '';  e1.className = 'cell empty';
    e2.textContent = '';  e2.className = 'cell empty';
    clearConnector();
    selected = null;

    // Combo
    combo++;
    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => { combo = 0; }, 1500);

    // Score
    const pts = 10 * Math.max(1, combo);
    score += pts;
    updateStats();
    if (combo >= 3) showToast(`🔥 ${combo}连击！ +${pts}`);

    // Win check
    if (countRemaining() === 0) { endGame(true); return; }

    // Deadlock check
    if (!hasAnyMove()) {
      showToast('💫 已自动洗牌！');
      reshuffleRemaining();
    }
  }, 380);
}

// ════════════════════════════════════════════════
//  PATH FINDING  (at most 2 turns / 3 segments)
// ════════════════════════════════════════════════
// The board is logically 1 cell larger on each side (border = empty) to allow
// paths through the perimeter.
function isEmpty(r, c) {
  if (r < -1 || r > ROWS || c < -1 || c > COLS) return false;
  if (r === -1 || r === ROWS || c === -1 || c === COLS) return true; // virtual border
  return grid[r][c] === '';
}

function findPath(r1, c1, r2, c2) {
  // Direct line (0 turns)
  if (r1 === r2) {
    if (lineFreeCols(r1, c1, c2)) return [{r:r1,c:c1},{r:r2,c:c2}];
  }
  if (c1 === c2) {
    if (lineFreeRows(c1, r1, r2)) return [{r:r1,c:c1},{r:r2,c:c2}];
  }

  // 1-turn (L-shape): 2 corner candidates
  // Corner (r1, c2)
  if ((isEmpty(r1, c2) || (r1===r2 && c1===c2)) &&
      lineFreeCols(r1, c1, c2) && lineFreeRows(c2, r1, r2)) {
    return [{r:r1,c:c1},{r:r1,c:c2},{r:r2,c:c2}];
  }
  // Corner (r2, c1)
  if ((isEmpty(r2, c1) || (r1===r2 && c1===c2)) &&
      lineFreeRows(c1, r1, r2) && lineFreeCols(r2, c1, c2)) {
    return [{r:r1,c:c1},{r:r2,c:c1},{r:r2,c:c2}];
  }

  // 2-turns: scan all intermediate rows and cols
  // Fix row k, path: (r1,c1)→(r1,ck)→(r2,ck)→(r2,c2) — wait this is wrong
  // Correct 2-turn shapes:
  // Shape A: (r1,c1)→(r1,ck)→(r2,ck)→(r2,c2)  — horizontal then vertical then horizontal
  for (let ck = -1; ck <= COLS; ck++) {
    if (ck === c1 || ck === c2) continue;
    if (isEmpty(r1, ck) && isEmpty(r2, ck) &&
        lineFreeCols(r1, c1, ck) && lineFreeRows(ck, r1, r2) && lineFreeCols(r2, ck, c2)) {
      return [{r:r1,c:c1},{r:r1,c:ck},{r:r2,c:ck},{r:r2,c:c2}];
    }
  }
  // Shape B: (r1,c1)→(rk,c1)→(rk,c2)→(r2,c2) — vertical then horizontal then vertical
  for (let rk = -1; rk <= ROWS; rk++) {
    if (rk === r1 || rk === r2) continue;
    if (isEmpty(rk, c1) && isEmpty(rk, c2) &&
        lineFreeRows(c1, r1, rk) && lineFreeCols(rk, c1, c2) && lineFreeRows(c2, rk, r2)) {
      return [{r:r1,c:c1},{r:rk,c:c1},{r:rk,c:c2},{r:r2,c:c2}];
    }
  }
  return null;
}

// Check if cells along a row from c1 to c2 (exclusive of endpoints) are empty
function lineFreeCols(r, c1, c2) {
  const [lo, hi] = c1 < c2 ? [c1+1, c2] : [c2+1, c1];
  for (let c = lo; c < hi; c++) if (!isEmpty(r, c)) return false;
  return true;
}
// Check if cells along a col from r1 to r2 (exclusive of endpoints) are empty
function lineFreeRows(c, r1, r2) {
  const [lo, hi] = r1 < r2 ? [r1+1, r2] : [r2+1, r1];
  for (let r = lo; r < hi; r++) if (!isEmpty(r, c)) return false;
  return true;
}

// ════════════════════════════════════════════════
//  CONNECTOR LINE
// ════════════════════════════════════════════════
function drawConnector(path) {
  const board = document.getElementById('board');
  const svg = document.getElementById('connector-svg');
  const br = board.getBoundingClientRect();
  svg.style.display = 'block';
  svg.innerHTML = '';

  const cellW = (br.width - 24) / COLS;  // approximate
  const cellH = (br.height - 24) / ROWS;
  const padX = 12, padY = 12;

  function cx(c) { return padX + (c + 0.5) * cellW; }
  function cy(r) { return padY + (r + 0.5) * cellH; }

  let d = `M ${cx(path[0].c)} ${cy(path[0].r)}`;
  for (let i = 1; i < path.length; i++) {
    d += ` L ${cx(path[i].c)} ${cy(path[i].r)}`;
  }
  const polyline = document.createElementNS('http://www.w3.org/2000/svg','path');
  polyline.setAttribute('d', d);
  polyline.setAttribute('class', 'conn-line');
  svg.appendChild(polyline);
}

function clearConnector() {
  const svg = document.getElementById('connector-svg');
  svg.style.display = 'none';
  svg.innerHTML = '';
}

// ════════════════════════════════════════════════
//  HINT
// ════════════════════════════════════════════════
function doHint() {
  if (!gameActive) return;
  clearHintGlow();
  const pair = findFirstMatch();
  if (!pair) { showToast('😿 没有可消除的对了，自动洗牌！'); reshuffleRemaining(); return; }
  hintCells = pair;
  const [a, b] = pair;
  cellEl(a.r, a.c).classList.add('hint-glow');
  cellEl(b.r, b.c).classList.add('hint-glow');
  score = Math.max(0, score - 5);
  updateStats();
}

function clearHintGlow() {
  document.querySelectorAll('.hint-glow').forEach(e => e.classList.remove('hint-glow'));
}

function findFirstMatch() {
  // Collect all non-empty cells grouped by emoji
  const map = {};
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) {
        if (!map[grid[r][c]]) map[grid[r][c]] = [];
        map[grid[r][c]].push({r, c});
      }
  for (const t in map) {
    const cells = map[t];
    for (let i = 0; i < cells.length; i++)
      for (let j = i + 1; j < cells.length; j++) {
        const a = cells[i], b = cells[j];
        if (findPath(a.r, a.c, b.r, b.c)) return [a, b];
      }
  }
  return null;
}

function hasAnyMove() { return !!findFirstMatch(); }

// ════════════════════════════════════════════════
//  SHUFFLE REMAINING
// ════════════════════════════════════════════════
function doShuffle() {
  if (!gameActive) return;
  reshuffleRemaining();
  score = Math.max(0, score - 10);
  updateStats();
  showToast('🔀 已洗牌！ -10分');
}

function reshuffleRemaining() {
  // Collect positions and values
  const positions = [], values = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c]) { positions.push({r, c}); values.push(grid[r][c]); }
  shuffle(values);
  positions.forEach((p, i) => { grid[p.r][p.c] = values[i]; });
  selected = null;
  clearHintGlow();
  clearConnector();
  renderBoard();
}

// ════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
