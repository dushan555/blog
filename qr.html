<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>show_widget</title>
</head>
<body>
<div id="qr-tool" style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif;max-width:560px;margin:0 auto;padding:20px;background:linear-gradient(160deg,#f8fafc,#eef2ff);border-radius:16px;border:1px solid #e2e8f0;box-sizing:border-box;">
  <style>
    #qr-tool *{box-sizing:border-box;}
    #qr-tool .qr-title{font-size:18px;font-weight:700;color:#1e293b;margin:0 0 4px;}
    #qr-tool .qr-sub{font-size:13px;color:#64748b;margin:0 0 16px;}
    #qr-tool .qr-drop{border:2px dashed #a5b4fc;border-radius:12px;padding:26px 16px;text-align:center;background:#fff;cursor:pointer;transition:.2s;}
    #qr-tool .qr-drop:hover{border-color:#6366f1;background:#f5f3ff;}
    #qr-tool .qr-drop.drag{border-color:#4f46e5;background:#eef2ff;}
    #qr-tool .qr-icon{font-size:34px;}
    #qr-tool .qr-hint{font-size:13px;color:#475569;margin-top:8px;}
    #qr-tool .qr-hint b{color:#4f46e5;}
    #qr-tool .qr-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
    #qr-tool button{flex:1;min-width:120px;padding:9px 12px;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;}
    #qr-tool .b1{background:#4f46e5;color:#fff;}
    #qr-tool .b2{background:#e2e8f0;color:#334155;}
    #qr-tool .qr-preview{margin-top:14px;text-align:center;}
    #qr-tool .qr-preview img{max-width:100%;max-height:200px;border-radius:10px;border:1px solid #e2e8f0;}
    #qr-tool .qr-result{margin-top:14px;padding:14px;border-radius:11px;font-size:14px;word-break:break-all;display:none;}
    #qr-tool .qr-result.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;display:block;}
    #qr-tool .qr-result.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;display:block;}
    #qr-tool .qr-result .lbl{font-size:12px;font-weight:700;opacity:.7;margin-bottom:6px;}
    #qr-tool .qr-result a{color:#4f46e5;}
    #qr-tool .qr-copy{margin-top:10px;font-size:12px;padding:6px 12px;background:#059669;color:#fff;border-radius:7px;display:inline-block;cursor:pointer;border:none;}
  </style>
  <p class="qr-title">二维码识别工具</p>
  <p class="qr-sub">上传、拖拽或粘贴一张含二维码的图片，即可自动解码内容。</p>
  <div class="qr-drop" id="qr-drop">
    <div class="qr-icon">📷</div>
    <div class="qr-hint">点击选择图片，或将图片<b>拖拽</b>到这里，也可直接 <b>Ctrl+V 粘贴</b></div>
  </div>
  <input type="file" id="qr-file" accept="image/*" style="display:none;">
  <div class="qr-btns">
    <button class="b1" id="qr-pick">选择图片</button>
    <button class="b2" id="qr-clear">清空</button>
  </div>
  <div class="qr-preview" id="qr-preview"></div>
  <div class="qr-result" id="qr-result"></div>
  <canvas id="qr-canvas" style="display:none;"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  var root=document.getElementById('qr-tool');
  var drop=root.querySelector('#qr-drop');
  var file=root.querySelector('#qr-file');
  var pick=root.querySelector('#qr-pick');
  var clear=root.querySelector('#qr-clear');
  var preview=root.querySelector('#qr-preview');
  var result=root.querySelector('#qr-result');
  var canvas=root.querySelector('#qr-canvas');

  function show(cls,html){result.className='qr-result '+cls;result.innerHTML=html;}
  function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  function decode(dataUrl){
    var img=new Image();
    img.onload=function(){
      preview.innerHTML='';preview.appendChild(img);
      var w=img.naturalWidth,h=img.naturalHeight;
      var max=1000,scale=Math.min(1,max/Math.max(w,h));
      canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var data=ctx.getImageData(0,0,canvas.width,canvas.height);
      if(typeof jsQR!=='function'){show('err','解码引擎未加载，请检查网络后重试。');return;}
      var code=jsQR(data.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
      if(code&&code.data){
        var t=code.data;
        var isUrl=/^https?:\/\//i.test(t);
        var content=isUrl?'<a href="'+esc(t)+'" target="_blank" rel="noopener">'+esc(t)+'</a>':esc(t);
        show('ok','<div class="lbl">✅ 识别成功</div>'+content+'<br><button class="qr-copy" id="qr-copy">复制内容</button>');
        var cb=root.querySelector('#qr-copy');
        cb.addEventListener('click',function(){
          navigator.clipboard.writeText(t).then(function(){cb.textContent='已复制';},function(){cb.textContent='复制失败';});
        });
      }else{
        show('err','❌ 未能识别到二维码。请确保图片清晰、二维码完整且未过度倾斜。');
      }
    };
    img.onerror=function(){show('err','图片加载失败，请更换图片。');};
    img.src=dataUrl;
  }

  function handleFile(f){
    if(!f||!/^image\//.test(f.type)){show('err','请提供图片文件。');return;}
    var r=new FileReader();
    r.onload=function(e){decode(e.target.result);};
    r.readAsDataURL(f);
  }

  pick.addEventListener('click',function(){file.click();});
  drop.addEventListener('click',function(){file.click();});
  file.addEventListener('change',function(e){if(e.target.files[0])handleFile(e.target.files[0]);});
  clear.addEventListener('click',function(){preview.innerHTML='';result.className='qr-result';result.innerHTML='';file.value='';});

  ['dragover','dragenter'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('drag');});});
  ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('drag');});});
  drop.addEventListener('drop',function(e){if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});

  document.addEventListener('paste',function(e){
    var items=e.clipboardData&&e.clipboardData.items;if(!items)return;
    for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){handleFile(items[i].getAsFile());break;}}
  });
})();
</script><script data-tabbit-widget-diagnostics="true">
(function(){
  if (window.__tabbitWidgetDiagnosticsInstalled) return;
  window.__tabbitWidgetDiagnosticsInstalled = true;
  window.__TABBIT_WIDGET_ERRORS__ = window.__TABBIT_WIDGET_ERRORS__ || [];
  function emit(level, args) {
    var payload = {
      type: "tabbit_widget_diagnostics",
      level: level,
      message: Array.prototype.slice.call(args || []).map(function(item) {
        if (item && item.stack) return item.stack;
        if (typeof item === "string") return item;
        try { return JSON.stringify(item); } catch (_) { return String(item); }
      }).join(" "),
      timestamp: Date.now()
    };
    window.__TABBIT_WIDGET_ERRORS__.push(payload);
    try { window.parent && window.parent.postMessage(payload, "*"); } catch (_) {}
  }
  var originalError = console.error;
  console.error = function() {
    emit("error", arguments);
    return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
</body>
</html>
