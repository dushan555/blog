<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 桌面宠物猫咪</title>
<style>
  :root {
    --pink:#ff85a1;--pink-l:#ffc2d1;--purple:#c77dff;--purple-l:#e0aaff;
    --yellow:#ffd166;--green:#06d6a0;--blue:#4cc9f0;--orange:#ff9f1c;
    --bg:#fff0f5;--card:#fff8fc;--text:#3d2c35;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Nunito','Segoe UI',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;overflow-x:hidden;position:relative;}

  /* ─── Background deco ─── */
  .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-circle{position:absolute;border-radius:50%;filter:blur(60px);opacity:.18;}

  /* ─── Nav ─── */
  nav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;
    padding:14px 32px;background:rgba(255,240,245,.9);backdrop-filter:blur(12px);
    border-bottom:2px solid var(--pink-l);box-shadow:0 2px 12px rgba(255,133,161,.12);}
  .logo{font-size:1.3rem;font-weight:800;color:var(--pink);}
  .back-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--purple);
    font-weight:700;padding:8px 18px;background:var(--purple-l);border-radius:20px;font-size:.9rem;transition:all .2s;}
  .back-btn:hover{background:var(--purple);color:#fff;}

  /* ─── Page layout ─── */
  .page-wrap{max-width:1000px;margin:0 auto;padding:32px 16px 80px;position:relative;z-index:1;}
  .page-title{text-align:center;font-size:2.4rem;font-weight:800;margin-bottom:6px;
    background:linear-gradient(135deg,var(--pink),var(--purple));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .page-sub{text-align:center;color:#9b6a7a;margin-bottom:36px;font-size:1.05rem;}

  /* ─── Two column layout ─── */
  .main-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;}
  @media(max-width:720px){.main-grid{grid-template-columns:1fr;}}

  /* ─── Pet Stage ─── */
  .pet-stage{background:var(--card);border-radius:28px;padding:24px;
    box-shadow:0 8px 32px rgba(199,125,255,.15);border:2px solid var(--purple-l);
    display:flex;flex-direction:column;align-items:center;min-height:480px;position:relative;}
  .stage-sky{width:100%;flex:1;min-height:260px;border-radius:20px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#d0f0fd 0%,#fce4ec 100%);}
  /* Clouds */
  .cloud{position:absolute;border-radius:50px;background:rgba(255,255,255,.75);}
  /* Floor */
  .stage-floor{width:100%;height:40px;background:linear-gradient(180deg,#b8f0c4,#7ee09a);border-radius:0 0 16px 16px;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;letter-spacing:6px;opacity:.7;}

  /* ─── Cat Widget ─── */
  #cat{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
    width:100px;cursor:grab;user-select:none;transition:filter .2s;z-index:10;}
  #cat:active{cursor:grabbing;}
  #cat.happy{filter:drop-shadow(0 0 12px rgba(255,209,102,.8));}
  #cat.sad{filter:grayscale(.5) drop-shadow(0 0 8px rgba(150,150,150,.5));}
  #cat.sleepy{filter:brightness(.85);}
  #cat.excited{filter:drop-shadow(0 0 14px rgba(199,125,255,.9)) brightness(1.1);}

  /* ─── Cat SVG / Pixel art ─── */
  .cat-body{font-size:72px;display:block;line-height:1;text-align:center;transition:all .3s;}
  .cat-state-label{text-align:center;font-size:.75rem;font-weight:700;color:#9b6a7a;margin-top:2px;background:rgba(255,255,255,.7);border-radius:10px;padding:2px 10px;}

  /* ─── Bubble ─── */
  #bubble{position:absolute;background:#fff;border:2.5px solid var(--pink-l);border-radius:18px;padding:10px 16px;
    font-size:.9rem;font-weight:700;color:var(--text);max-width:200px;line-height:1.4;
    box-shadow:0 4px 16px rgba(255,133,161,.2);pointer-events:none;opacity:0;
    transition:opacity .3s;z-index:20;white-space:nowrap;}
  #bubble::after{content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--pink-l);}
  #bubble.show{opacity:1;}

  /* ─── Walk stars / hearts ─── */
  .particle{position:absolute;pointer-events:none;font-size:1.4rem;animation:particleFly .9s ease-out forwards;z-index:30;}
  @keyframes particleFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.4)}}

  /* ─── Stats Panel ─── */
  .stats-panel{display:flex;flex-direction:column;gap:14px;}
  .panel-card{background:var(--card);border-radius:22px;padding:20px 24px;
    box-shadow:0 4px 20px rgba(199,125,255,.1);border:2px solid var(--purple-l);}
  .panel-card h3{font-size:1.05rem;font-weight:800;margin-bottom:14px;color:var(--text);}

  /* Status bars */
  .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .stat-row:last-child{margin-bottom:0;}
  .stat-icon{font-size:1.3rem;flex-shrink:0;width:28px;text-align:center;}
  .stat-name{font-size:.82rem;font-weight:700;color:#9b6a7a;width:44px;flex-shrink:0;}
  .bar-bg{flex:1;height:14px;background:#f0e6f6;border-radius:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
  .bar-fill.hunger{background:linear-gradient(90deg,var(--orange),var(--yellow));}
  .bar-fill.happy {background:linear-gradient(90deg,var(--pink),var(--purple));}
  .bar-fill.energy{background:linear-gradient(90deg,var(--blue),var(--green));}
  .stat-val{font-size:.82rem;font-weight:800;color:var(--purple);width:34px;text-align:right;flex-shrink:0;}

  /* Mood */
  .mood-display{text-align:center;padding:8px 0 4px;}
  .mood-emoji{font-size:3rem;display:block;}
  .mood-text{font-weight:800;font-size:1rem;color:var(--purple);margin-top:4px;}

  /* Action buttons */
  .actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .act-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;
    border-radius:18px;border:2.5px solid;cursor:pointer;font-weight:800;font-size:.85rem;
    background:#fff;transition:all .22s;font-family:inherit;}
  .act-btn:hover{transform:translateY(-3px);}
  .act-btn:disabled{opacity:.45;pointer-events:none;}
  .act-btn .icon{font-size:1.8rem;}
  .act-btn.feed  {border-color:var(--orange);color:var(--orange);}
  .act-btn.play  {border-color:var(--purple);color:var(--purple);}
  .act-btn.sleep {border-color:var(--blue)  ;color:var(--blue);  }
  .act-btn.pat   {border-color:var(--pink)  ;color:var(--pink);  }
  .act-btn.feed:hover  {background:var(--orange);color:#fff;}
  .act-btn.play:hover  {background:var(--purple);color:#fff;}
  .act-btn.sleep:hover {background:var(--blue);  color:#fff;}
  .act-btn.pat:hover   {background:var(--pink);  color:#fff;}

  /* Diary */
  .diary{background:var(--card);border-radius:22px;padding:20px 24px;
    box-shadow:0 4px 20px rgba(199,125,255,.1);border:2px solid var(--pink-l);}
  .diary h3{font-size:1.05rem;font-weight:800;margin-bottom:12px;}
  .diary-list{list-style:none;max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;}
  .diary-list li{font-size:.85rem;color:#9b6a7a;padding:6px 10px;background:rgba(255,193,209,.12);
    border-radius:10px;border-left:3px solid var(--pink-l);}
  .diary-list li:first-child{border-left-color:var(--purple);color:var(--text);}

  /* Toast */
  #toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
    padding:12px 28px;border-radius:24px;font-weight:800;font-size:1rem;
    box-shadow:0 8px 24px rgba(255,133,161,.4);pointer-events:none;
    opacity:0;transition:all .3s;z-index:400;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Sleeping ZZZ */
  .zzz{position:absolute;font-size:1.2rem;animation:zzzFloat 1.8s ease-out infinite;}
  @keyframes zzzFloat{0%{opacity:.9;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(20px,-50px) scale(.5)}}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-deco">
  <div class="bg-circle" style="width:500px;height:500px;background:var(--pink);top:-120px;left:-180px;"></div>
  <div class="bg-circle" style="width:400px;height:400px;background:var(--purple);bottom:-100px;right:-120px;"></div>
  <div class="bg-circle" style="width:300px;height:300px;background:var(--blue);top:40%;left:55%;"></div>
</div>

<nav>
  <div class="logo">🐾 桌面宠物</div>
  <a href="index.html" class="back-btn">← 返回主页</a>
</nav>

<div class="page-wrap">
  <h1 class="page-title">🐾 我的桌面宠物</h1>
  <p class="page-sub">领养一只专属猫咪，好好照顾它吧！🐱💕</p>

  <div class="main-grid">
    <!-- Pet Stage -->
    <div class="pet-stage">
      <div class="stage-sky" id="stage-sky">
        <!-- Clouds injected by JS -->
        <div id="bubble"></div>
        <div id="cat">
          <span class="cat-body" id="cat-body">🐱</span>
          <div class="cat-state-label" id="state-label">悠闲漫步中…</div>
        </div>
      </div>
      <div class="stage-floor">🌿🌱🌿🌱🌿🌱🌿</div>
    </div>

    <!-- Stats Panel -->
    <div class="stats-panel">

      <!-- Mood -->
      <div class="panel-card">
        <h3>😺 今日心情</h3>
        <div class="mood-display">
          <span class="mood-emoji" id="mood-emoji">😺</span>
          <div class="mood-text" id="mood-text">心情不错！</div>
        </div>
      </div>

      <!-- Status bars -->
      <div class="panel-card">
        <h3>📊 宠物状态</h3>
        <div class="stat-row">
          <span class="stat-icon">🍱</span>
          <span class="stat-name">饱食度</span>
          <div class="bar-bg"><div class="bar-fill hunger" id="bar-hunger" style="width:80%"></div></div>
          <span class="stat-val" id="val-hunger">80</span>
        </div>
        <div class="stat-row">
          <span class="stat-icon">💖</span>
          <span class="stat-name">快乐度</span>
          <div class="bar-bg"><div class="bar-fill happy" id="bar-happy" style="width:75%"></div></div>
          <span class="stat-val" id="val-happy">75</span>
        </div>
        <div class="stat-row">
          <span class="stat-icon">⚡</span>
          <span class="stat-name">精力值</span>
          <div class="bar-bg"><div class="bar-fill energy" id="bar-energy" style="width:90%"></div></div>
          <span class="stat-val" id="val-energy">90</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="panel-card">
        <h3>🎮 互动操作</h3>
        <div class="actions-grid">
          <button class="act-btn feed" onclick="doFeed()">
            <span class="icon">🍣</span>喂食
          </button>
          <button class="act-btn play" onclick="doPlay()">
            <span class="icon">🎾</span>玩耍
          </button>
          <button class="act-btn sleep" id="btn-sleep" onclick="doSleep()">
            <span class="icon">💤</span>睡觉
          </button>
          <button class="act-btn pat" onclick="doPat()">
            <span class="icon">🤝</span>摸头
          </button>
        </div>
      </div>

      <!-- Diary -->
      <div class="diary">
        <h3>📔 宠物日记</h3>
        <ul class="diary-list" id="diary-list">
          <li>🐱 猫咪来到了新家，好开心！</li>
        </ul>
      </div>

    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
const state = {
  hunger: 80,
  happy:  75,
  energy: 90,
  mood: 'normal',   // normal | happy | sad | sleepy | excited | angry
  sleeping: false,
  walking: true,
  lastAction: Date.now(),
};

// ══════════════════════════════════════════
//  CAT MOODS
// ══════════════════════════════════════════
const MOODS = {
  happy:   { emoji:'😸', text:'超级开心！', body:'😸', cls:'happy'   },
  excited: { emoji:'😻', text:'兴奋极了！', body:'😻', cls:'excited' },
  normal:  { emoji:'😺', text:'心情不错！', body:'🐱', cls:''        },
  sleepy:  { emoji:'😴', text:'好困哦……',  body:'😴', cls:'sleepy'  },
  sad:     { emoji:'😿', text:'有点难过…', body:'😿', cls:'sad'      },
  hungry:  { emoji:'🙀', text:'好饿啊！！', body:'🙀', cls:'sad'     },
  angry:   { emoji:'😾', text:'别烦我！',  body:'😾', cls:'sad'      },
};

const BUBBLES = {
  feed:  ['好吃好吃～🐟','谢谢铲屎官！','Nom nom nom~','再来一份！🍣','世界上最幸福的猫！'],
  play:  ['冲冲冲！🏃','我是最厉害的猫！','耶耶耶！🎾','好好玩～～','再来一局！'],
  sleep: ['Zzz...💤','轻一点…我要睡觉','梦里有鱼…🐟','呼呼呼……','好困好困…'],
  pat:   ['喵～好舒服～','呼噜呼噜～','再摸摸嘛！💕','舒服极了～','♡ ♡ ♡'],
  idle:  ['在看什么呢？','喵～','今天天气真好','有鱼吃吗？','好无聊呀～','发呆中……','Meow?','喵喵喵～'],
  hungry:['饿了饿了！','肚子在叫……','快喂我！🍣','给！我！吃！的！'],
  sad:   ['陪陪我嘛…','好孤单……','Orz','喵呜……😿'],
  sleepy:['Zzz','困死了……','太累了……','要睡着了……'],
};

// ══════════════════════════════════════════
//  DOM REFS
// ══════════════════════════════════════════
const catEl    = document.getElementById('cat');
const catBody  = document.getElementById('cat-body');
const stateLabel = document.getElementById('state-label');
const bubbleEl = document.getElementById('bubble');
const sky      = document.getElementById('stage-sky');
const diaryList= document.getElementById('diary-list');

// ══════════════════════════════════════════
//  INIT CLOUDS
// ══════════════════════════════════════════
const cloudDefs = [
  {top:'12%',left:'5%',w:80,h:30,delay:0},
  {top:'28%',left:'55%',w:110,h:36,delay:4},
  {top:'8%',left:'72%',w:65,h:24,delay:8},
];
cloudDefs.forEach(({top,left,w,h,delay}) => {
  const c = document.createElement('div');
  c.className = 'cloud';
  c.style.cssText = `top:${top};left:${left};width:${w}px;height:${h}px;
    animation:cloudDrift ${18+delay}s linear infinite;animation-delay:-${delay*2}s;`;
  sky.appendChild(c);
});

// Add keyframes for cloud drift
const style = document.createElement('style');
style.textContent = `
@keyframes cloudDrift{0%{transform:translateX(0)}50%{transform:translateX(28px)}100%{transform:translateX(0)}}
`;
document.head.appendChild(style);

// ══════════════════════════════════════════
//  DRAG
// ══════════════════════════════════════════
let dragging = false, dragOffX = 0, dragOffY = 0;

catEl.addEventListener('mousedown', startDrag);
catEl.addEventListener('touchstart', startDragTouch, {passive:false});

function startDrag(e) {
  e.preventDefault();
  dragging = true;
  const r = catEl.getBoundingClientRect();
  dragOffX = e.clientX - r.left - r.width/2;
  dragOffY = e.clientY - r.top  - r.height/2;
  catEl.style.transition = 'none';
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup',   endDrag);
}
function startDragTouch(e) {
  e.preventDefault();
  const t = e.touches[0];
  dragging = true;
  const r = catEl.getBoundingClientRect();
  dragOffX = t.clientX - r.left - r.width/2;
  dragOffY = t.clientY - r.top  - r.height/2;
  catEl.style.transition = 'none';
  document.addEventListener('touchmove', onDragTouch, {passive:false});
  document.addEventListener('touchend',  endDrag);
}

function onDrag(e) {
  if (!dragging) return;
  moveCat(e.clientX, e.clientY);
}
function onDragTouch(e) {
  if (!dragging) return;
  e.preventDefault();
  moveCat(e.touches[0].clientX, e.touches[0].clientY);
}

function moveCat(clientX, clientY) {
  const sr = sky.getBoundingClientRect();
  let x = clientX - sr.left - dragOffX - 50;
  let y = clientY - sr.top  - dragOffY - 50;
  x = Math.max(0, Math.min(sr.width  - 100, x));
  y = Math.max(0, Math.min(sr.height - 100, y));
  catEl.style.left   = x + 'px';
  catEl.style.bottom = 'auto';
  catEl.style.top    = y + 'px';
  catEl.style.transform = 'none';
  spawnParticle(clientX - sr.left, clientY - sr.top, '🐾');
}

function endDrag() {
  dragging = false;
  catEl.style.transition = '';
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup',   endDrag);
  document.removeEventListener('touchmove', onDragTouch);
  document.removeEventListener('touchend',  endDrag);
  showBubble(pick(['被抓起来啦！','放我下去～','喵！！','飞起来啦！', '哇哦！']));
  addDiary('😺 被铲屎官抱起来玩了！');
  state.happy = clamp(state.happy + 5, 0, 100);
  updateUI();
}

// ══════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════
function doFeed() {
  if (state.sleeping) { showToast('😴 猫咪在睡觉，别打扰它～'); return; }
  state.hunger = clamp(state.hunger + 25, 0, 100);
  state.happy  = clamp(state.happy  + 8,  0, 100);
  state.lastAction = Date.now();
  showBubble(pick(BUBBLES.feed));
  spawnParticlesAround('🍣', 4);
  addDiary('🍣 吃了美味的鱼！饱食度+25');
  showToast('🍣 投喂成功！猫咪很满意～');
  animateCat('excited', 2000);
  updateUI();
}

function doPlay() {
  if (state.sleeping) { showToast('😴 猫咪在睡觉，先让它休息～'); return; }
  if (state.energy < 15) { showToast('⚡ 猫咪太累了，先让它休息！'); return; }
  state.happy  = clamp(state.happy  + 20, 0, 100);
  state.energy = clamp(state.energy - 15, 0, 100);
  state.hunger = clamp(state.hunger - 8,  0, 100);
  state.lastAction = Date.now();
  showBubble(pick(BUBBLES.play));
  spawnParticlesAround('🎾', 5);
  addDiary('🎾 一起玩了好久！快乐+20，精力-15');
  showToast('🎾 玩耍成功！猫咪玩得很开心～');
  animateCat('excited', 2500);
  walkAnimation();
  updateUI();
}

function doSleep() {
  if (state.sleeping) {
    // Wake up
    state.sleeping = false;
    document.getElementById('btn-sleep').querySelector('.icon').textContent = '💤';
    document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '睡觉';
    removeZzz();
    showBubble('起来啦！伸个懒腰～');
    addDiary('☀️ 睡醒了！精力满满～');
    animateCat('happy', 2000);
  } else {
    state.sleeping = true;
    document.getElementById('btn-sleep').querySelector('.icon').textContent = '🌅';
    document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '唤醒';
    showBubble(pick(BUBBLES.sleep));
    addDiary('💤 开始睡大觉了……');
    showToast('💤 猫咪进入梦乡～');
    spawnZzz();
  }
  updateUI();
}

function doPat() {
  if (state.sleeping) { showBubble('…(翻身继续睡)'); return; }
  state.happy = clamp(state.happy + 12, 0, 100);
  state.lastAction = Date.now();
  showBubble(pick(BUBBLES.pat));
  spawnParticlesAround('💕', 6);
  addDiary('🤝 被摸头了！超级舒服～快乐+12');
  animateCat('happy', 1800);
  updateUI();
}

// ══════════════════════════════════════════
//  SLEEPING ZZZ
// ══════════════════════════════════════════
let zzzInterval = null;
function spawnZzz() {
  zzzInterval = setInterval(() => {
    const z = document.createElement('div');
    z.className = 'zzz';
    z.textContent = pick(['z','Z','z z','Z z Z']);
    z.style.cssText = `right:${10+Math.random()*30}px;top:${20+Math.random()*30}px;color:var(--blue);font-weight:800;`;
    catEl.appendChild(z);
    setTimeout(() => z.remove(), 1900);
  }, 900);
}
function removeZzz() {
  clearInterval(zzzInterval);
  zzzInterval = null;
  catEl.querySelectorAll('.zzz').forEach(z => z.remove());
}

// ══════════════════════════════════════════
//  UI UPDATE
// ══════════════════════════════════════════
function updateUI() {
  // Bars
  setBar('hunger', state.hunger);
  setBar('happy',  state.happy);
  setBar('energy', state.energy);
  // Mood
  const m = calcMood();
  state.mood = m;
  const md = MOODS[m];
  document.getElementById('mood-emoji').textContent = md.emoji;
  document.getElementById('mood-text').textContent  = md.text;
  // Cat appearance
  if (!state.sleeping) {
    catBody.textContent = md.body;
    catEl.className = md.cls;
  } else {
    catBody.textContent = '😴';
    catEl.className = 'sleepy';
  }
  // State label
  if (state.sleeping) stateLabel.textContent = '呼呼大睡中…';
  else if (m === 'hungry') stateLabel.textContent = '饿坏啦，快喂我！';
  else if (m === 'sad')    stateLabel.textContent = '心情不太好……';
  else if (m === 'excited')stateLabel.textContent = '超级兴奋！！';
  else if (m === 'happy')  stateLabel.textContent = '开心极啦！';
  else                     stateLabel.textContent = '悠闲漫步中…';
}

function setBar(name, val) {
  document.getElementById('bar-' + name).style.width = val + '%';
  document.getElementById('val-' + name).textContent = Math.round(val);
}

function calcMood() {
  if (state.sleeping) return 'sleepy';
  if (state.hunger < 20) return 'hungry';
  if (state.energy < 15) return 'sleepy';
  if (state.happy >= 85) return 'excited';
  if (state.happy >= 65) return 'happy';
  if (state.happy < 30)  return 'sad';
  return 'normal';
}

// ══════════════════════════════════════════
//  ANIMATIONS
// ══════════════════════════════════════════
function animateCat(cls, duration) {
  catEl.classList.add(cls);
  setTimeout(() => catEl.classList.remove(cls), duration);
}

let walkDir = 1, walkPos = null, walkRAF = null;
function walkAnimation() {
  if (walkRAF) cancelAnimationFrame(walkRAF);
  const sr = sky;
  const maxX = sr.offsetWidth - 100;
  if (walkPos === null) walkPos = parseInt(catEl.style.left) || (maxX/2);
  let speed = 1.2;
  let steps = 0;
  const maxSteps = 120;
  function step() {
    if (state.sleeping || steps > maxSteps) { walkRAF = null; return; }
    walkPos += speed * walkDir;
    if (walkPos < 0) { walkPos = 0; walkDir = 1; }
    if (walkPos > maxX) { walkPos = maxX; walkDir = -1; }
    catEl.style.left   = walkPos + 'px';
    catEl.style.bottom = '40px';
    catEl.style.top    = 'auto';
    catEl.style.transform = 'none';
    steps++;
    walkRAF = requestAnimationFrame(step);
  }
  walkRAF = requestAnimationFrame(step);
}

// ══════════════════════════════════════════
//  BUBBLE
// ══════════════════════════════════════════
let bubbleTimer;
function showBubble(text) {
  bubbleEl.textContent = text;
  const cr = catEl.getBoundingClientRect();
  const sr = sky.getBoundingClientRect();
  const bx = catEl.offsetLeft + 50;
  const by = catEl.offsetTop  - 10;
  bubbleEl.style.left = Math.max(0, bx - 100) + 'px';
  bubbleEl.style.top  = Math.max(0, by - 70)  + 'px';
  bubbleEl.style.bottom = 'auto';
  bubbleEl.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), 2600);
}

// ══════════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════════
function spawnParticle(x, y, emoji) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = emoji;
  p.style.cssText = `left:${x - 12}px;top:${y - 12}px;`;
  sky.appendChild(p);
  setTimeout(() => p.remove(), 950);
}
function spawnParticlesAround(emoji, n) {
  const sr = sky.getBoundingClientRect();
  const cx = catEl.offsetLeft + 50;
  const cy = catEl.offsetTop  + 40;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      spawnParticle(cx + (Math.random()-0.5)*80, cy + (Math.random()-0.5)*60, emoji);
    }, i * 120);
  }
}

// ══════════════════════════════════════════
//  DIARY
// ══════════════════════════════════════════
function addDiary(text) {
  const li = document.createElement('li');
  const now = new Date();
  li.textContent = `[${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}] ${text}`;
  diaryList.insertBefore(li, diaryList.firstChild);
  if (diaryList.children.length > 20) diaryList.removeChild(diaryList.lastChild);
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ══════════════════════════════════════════
//  PASSIVE DECAY LOOP (every 5s)
// ══════════════════════════════════════════
setInterval(() => {
  if (!state.sleeping) {
    state.hunger = clamp(state.hunger - 1.5, 0, 100);
    state.happy  = clamp(state.happy  - 0.8, 0, 100);
    state.energy = clamp(state.energy - 0.5, 0, 100);
    // Idle chatter
    if (Math.random() < 0.3) {
      const m = calcMood();
      const pool = m === 'hungry' ? BUBBLES.hungry : m === 'sad' ? BUBBLES.sad : m === 'sleepy' ? BUBBLES.sleepy : BUBBLES.idle;
      showBubble(pick(pool));
    }
  } else {
    // Sleeping restores energy
    state.energy = clamp(state.energy + 4, 0, 100);
    if (state.energy >= 100) {
      state.sleeping = false;
      document.getElementById('btn-sleep').querySelector('.icon').textContent = '💤';
      document.getElementById('btn-sleep').querySelector('span:last-child').textContent = '睡觉';
      removeZzz();
      showBubble('睡饱啦！精力满格！⚡');
      addDiary('☀️ 自然醒了！精力满格！');
    }
  }
  updateUI();
}, 5000);

// ══════════════════════════════════════════
//  RANDOM WALK (every 8s)
// ══════════════════════════════════════════
setInterval(() => {
  if (!state.sleeping && !dragging) {
    walkDir = Math.random() < 0.5 ? 1 : -1;
    walkAnimation();
  }
}, 8000);

catEl.addEventListener('dblclick', (e) => {
  if (!dragging) doPat();
});

updateUI();
setTimeout(() => showBubble('喵～你好呀！我是你的桌面猫！🐾'), 800);
setTimeout(() => addDiary('🏡 搬进新家了！好开心～'), 500);
walkAnimation();
</script>
